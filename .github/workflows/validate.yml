name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax check shell scripts
        run: |
          sh -n scripts/install-pinned.sh
          sh -n scripts/sync-upstream.sh
          bash -n shell/caveman-prompt.sh
